[project]
name = "findex"
version = "0.7.0"
description = "Вебпошук на FastAPI з HTML-інтерфейсом та REST API"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "findex student project"}]
dependencies = ["typer>=0.12", "rich>=13.7", "httpx>=0.27", "fastapi>=0.110", "uvicorn>=0.28", "pydantic-settings>=2", "jinja2>=3"]

[project.scripts]
findex = "findex.cli:app"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6", "ruff>=0.9", "pyright>=1.1"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: benchmarks or large data tests"]

[tool.pyright]
include = ["src/findex"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
